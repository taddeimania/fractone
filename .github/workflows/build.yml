# Builds and tests Fractone on macOS, Windows and Linux. Runs only when you
# start it: Actions tab -> "Build" -> "Run workflow", then pick what to build
# in "Use workflow from".
#
# - A branch (e.g. main): build, test, and keep the packaged plugins as run
#   artifacts for 30 days.
# - A version tag (v1.2.3): the same builds, then a *draft* GitHub release is
#   created with the three archives attached and the text from
#   .github/release-notes.md. Review it on the Releases page and publish.
#   The tag must match project(Fractone VERSION ...) in CMakeLists.txt.

name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  JUCE_VERSION: "8.0.9"

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
          - platform: Windows
            os: windows-latest
          - platform: Linux
            os: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      # A release tag must match the version the plugin reports, or the
      # downloads would be labelled with the wrong version.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^project(Fractone VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match CMakeLists.txt (VERSION $version). Update project(Fractone VERSION ...), commit, and move the tag."
            exit 1
          fi

      # JUCE is about 100 MB; keep a copy between runs instead of downloading it every time.
      - name: Restore JUCE
        id: juce-cache
        uses: actions/cache@v6
        with:
          path: .juce
          key: juce-${{ env.JUCE_VERSION }}-${{ runner.os }}

      - name: Download JUCE
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git .juce

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      - name: Configure
        run: |
          extra=()
          case "$RUNNER_OS" in
            Windows) extra+=(-A x64) ;;
            macOS)   extra+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64") ;;
          esac
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DFRACTONE_COPY_PLUGIN=OFF \
            -DFRACTONE_JUCE_DIR=.juce \
            "${extra[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Package the plugins ourselves so file permissions and the macOS code
      # signature survive the download. Release builds are named by version
      # only; other builds also carry the commit.
      - name: Package
        run: |
          version=$(sed -n 's/^project(Fractone VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          name="Fractone-${version}-${{ matrix.platform }}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then name="${name}-${GITHUB_SHA::7}"; fi
          art=build/Fractone_artefacts/Release
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage"
          cp -R "$art/VST3/Fractone.vst3" "$stage/"
          case "$RUNNER_OS" in
            macOS)
              cp -R "$art/AU/Fractone.component" "$stage/"
              cp -R "$art/Standalone/Fractone.app" "$stage/"
              ditto -c -k --sequesterRsrc --keepParent "$stage" "$GITHUB_WORKSPACE/$name.zip"
              echo "ARCHIVE=$name.zip" >> "$GITHUB_ENV" ;;
            Windows)
              cp "$art/Standalone/Fractone.exe" "$stage/"
              (cd "$RUNNER_TEMP" && 7z a -tzip "$GITHUB_WORKSPACE/$name.zip" "$name" > /dev/null)
              echo "ARCHIVE=$name.zip" >> "$GITHUB_ENV" ;;
            Linux)
              cp "$art/Standalone/Fractone" "$stage/"
              tar -czf "$GITHUB_WORKSPACE/$name.tar.gz" -C "$RUNNER_TEMP" "$name"
              echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV" ;;
          esac

      # Let the action wrap the archive in its own zip. Uploading it raw
      # (archive: false) makes the artifact itself a zip, which the download
      # step then unpacks, so the macOS and Windows archives arrived as loose
      # folders and could not be attached to the release. Our archive is a
      # single opaque file either way, so the permissions and the macOS
      # signature inside it still survive the round trip.
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 30

  # Version tags only: gather the three archives into a draft release.
  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Collect the builds
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Fail here rather than part way through uploading assets, so a packaging
      # problem is obvious instead of showing up as a confusing gh error.
      - name: Check the downloads are archives, not unpacked folders
        run: |
          ls -la dist
          bad=0
          for f in dist/*; do
            [ -f "$f" ] && continue
            echo "::error::$f is a folder, not an archive. The artifact was unpacked on download."
            bad=1
          done
          [ "$bad" = 0 ]

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --verify-tag \
            --title "Fractone ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
