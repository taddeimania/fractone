# Builds and tests Fractone on macOS, Windows and Linux. Runs only when you
# start it: Actions tab -> "Build" -> "Run workflow", then pick what to build
# in "Use workflow from".
#
# - A branch (e.g. main): build, test, and keep the packaged plugins as run
#   artifacts for 30 days.
# - A version tag (v1.2.3): the same builds, then a *draft* GitHub release is
#   created with the three archives attached and the text from
#   .github/release-notes.md. Review it on the Releases page and publish.
#   The tag must match project(Fractone VERSION ...) in CMakeLists.txt.

name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  JUCE_VERSION: "8.0.9"

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
          - platform: Windows
            os: windows-latest
          - platform: Linux
            os: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      # A release tag must match the version the plugin reports, or the
      # downloads would be labelled with the wrong version.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^project(Fractone VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match CMakeLists.txt (VERSION $version). Update project(Fractone VERSION ...), commit, and move the tag."
            exit 1
          fi

      # JUCE is about 100 MB; keep a copy between runs instead of downloading it every time.
      - name: Restore JUCE
        id: juce-cache
        uses: actions/cache@v6
        with:
          path: .juce
          key: juce-${{ env.JUCE_VERSION }}-${{ runner.os }}

      - name: Download JUCE
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git .juce

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      - name: Configure
        run: |
          extra=()
          case "$RUNNER_OS" in
            Windows) extra+=(-A x64) ;;
            macOS)   extra+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64") ;;
          esac
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DFRACTONE_COPY_PLUGIN=OFF \
            -DFRACTONE_JUCE_DIR=.juce \
            "${extra[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # macOS: sign with the Developer ID and notarize, so the plug-in loads without
      # the quarantine workaround. Needs the secrets MACOS_CERT_P12 (base64 .p12),
      # MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY, NOTARY_KEY_P8 (base64 .p8),
      # NOTARY_KEY_ID and NOTARY_ISSUER_ID: the same certificate and key as Lathe.
      # A version tag without them fails here, so every released Mac build is
      # notarized. Branch builds without them keep the local (ad-hoc) signature,
      # for testing only. Signs in place, so Package picks up the signed bundles.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::Releases must be signed and notarized: the macOS signing secrets are missing."
              exit 1
            fi
            echo "No signing secrets: this branch build keeps its local signature (for testing, not for release)."
            exit 0
          fi
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kpass="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kpass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kpass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          # Every bundle the build made: VST3, and the AU and standalone app where there are any.
          shopt -s nullglob
          bundles=(build/*_artefacts/Release/VST3/*.vst3 build/*_artefacts/Release/AU/*.component build/*_artefacts/Release/Standalone/*.app)
          if [ ${#bundles[@]} -eq 0 ]; then
            echo "::error::No plug-in bundles found to sign."
            exit 1
          fi
          for b in "${bundles[@]}"; do
            codesign --force --timestamp --options runtime --sign "$MACOS_SIGN_IDENTITY" "$b"
            codesign --verify --strict --verbose=2 "$b"
          done

          # One submission for all of them, then a ticket stapled to each.
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          mkdir -p "$RUNNER_TEMP/notarize"
          cp -R "${bundles[@]}" "$RUNNER_TEMP/notarize/"
          ditto -c -k --keepParent "$RUNNER_TEMP/notarize" "$RUNNER_TEMP/notarize.zip"
          result=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait --output-format json \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID") || true
          echo "$result"
          status=$(echo "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')
          if [ "$status" != "Accepted" ]; then
            id=$(echo "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')
            [ -n "$id" ] && xcrun notarytool log "$id" --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
            echo "::error::Notarization wasn't accepted (status: ${status:-unknown})."
            exit 1
          fi
          for b in "${bundles[@]}"; do
            xcrun stapler staple "$b"
            xcrun stapler validate "$b"
          done

      # Package the plugins ourselves so file permissions and the macOS code
      # signature survive the download. Release builds are named by version
      # only; other builds also carry the commit.
      - name: Package
        run: |
          version=$(sed -n 's/^project(Fractone VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          name="Fractone-${version}-${{ matrix.platform }}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then name="${name}-${GITHUB_SHA::7}"; fi
          art=build/Fractone_artefacts/Release
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage"
          cp -R "$art/VST3/Fractone.vst3" "$stage/"
          case "$RUNNER_OS" in
            macOS)
              cp -R "$art/AU/Fractone.component" "$stage/"
              cp -R "$art/Standalone/Fractone.app" "$stage/"
              ditto -c -k --sequesterRsrc --keepParent "$stage" "$GITHUB_WORKSPACE/$name.zip"
              echo "ARCHIVE=$name.zip" >> "$GITHUB_ENV" ;;
            Windows)
              cp "$art/Standalone/Fractone.exe" "$stage/"
              (cd "$RUNNER_TEMP" && 7z a -tzip "$GITHUB_WORKSPACE/$name.zip" "$name" > /dev/null)
              echo "ARCHIVE=$name.zip" >> "$GITHUB_ENV" ;;
            Linux)
              cp "$art/Standalone/Fractone" "$stage/"
              tar -czf "$GITHUB_WORKSPACE/$name.tar.gz" -C "$RUNNER_TEMP" "$name"
              echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV" ;;
          esac

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          archive: false
          if-no-files-found: error
          retention-days: 30

  # Version tags only: gather the three archives into a draft release.
  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Collect the builds
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          # Keep the .zip archives as they are; by default they'd be unpacked.
          skip-decompress: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          if find dist -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            echo "::error::Expected only archives in dist/, found folders."
            exit 1
          fi
          # Re-running after a failure: add the files to the existing draft.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --draft \
              --verify-tag \
              --title "Fractone ${GITHUB_REF_NAME#v}" \
              --notes-file .github/release-notes.md
          fi
